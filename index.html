<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Bernaldez Family Tree &amp; Directory</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span>🌳</span>
      <span id="header-title">Bernaldez Family Tree</span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-secondary" onclick="openQrModal()">📱 QR</button>
      <button type="button" class="btn-primary" onclick="openJoinForm(false)">+ Join Tree</button>
    </div>
  </header>

  <div id="dyk-banner" class="dyk-banner" style="display: none;">
    <span id="dyk-text"></span>
    <div class="dyk-controls">
      <button type="button" onclick="generateDidYouKnow()" title="Next fact">↻</button>
      <button type="button" onclick="document.getElementById('dyk-banner').style.display='none'" title="Dismiss">×</button>
    </div>
  </div>

  <div class="search-wrap">
    <input
      type="text"
      id="search-input"
      placeholder="Search name, nickname, hobby, sport..."
      oninput="handleSearch(this.value)"
    />
    <div id="search-results" class="search-results" style="display: none;"></div>
  </div>

  <div id="loader" class="loader">Loading family tree...</div>

  <main class="tree-viewport">
    <div id="tree-canvas" class="tree-canvas">
      <div id="tree-root" class="tree-root"></div>
    </div>
  </main>

  <div class="zoom-controls">
    <button type="button" onclick="adjustZoom(0.2)" title="Zoom in">+</button>
    <button type="button" onclick="resetZoom()" title="Reset zoom">1:1</button>
    <button type="button" onclick="adjustZoom(-0.2)" title="Zoom out">−</button>
  </div>

  <!-- PROFILE DRAWER -->
  <div id="profile-overlay" class="overlay" style="display: none;" onclick="closeOverlay(event, 'profile-overlay')">
    <div id="profile-drawer-content" class="drawer-card" onclick="event.stopPropagation()"></div>
  </div>

  <!-- ADD / EDIT MEMBER MODAL -->
  <div id="form-overlay" class="overlay" style="display: none;" onclick="closeOverlay(event, 'form-overlay')">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button type="button" class="close-drawer" onclick="document.getElementById('form-overlay').style.display='none'">×</button>
      <h2 id="form-heading">Join the Family Tree</h2>
      <p id="form-sub" class="modal-sub">Add yourself so relatives can connect with you.</p>

      <form id="join-form" onsubmit="submitMember(event)">
        <input type="hidden" id="EditMemberID" value="" />

        <div class="form-group" id="lineage-group">
          <label id="lineage-label" for="LineageBranch">Whose descendant are you? (Children of Monica &amp; Lolo) *</label>
          <select id="LineageBranch" onchange="onLineageBranchChange()" required>
            <option value="">-- Select whose descendant you are --</option>
          </select>
        </div>

        <div class="form-group" id="passkey-group">
          <label for="FamilyPasscode">Family Passkey (Members Only) *</label>
          <input type="password" id="FamilyPasscode" placeholder="Enter family passkey" required />
        </div>

        <div id="role-toggle-wrap" class="role-toggle">
          <button type="button" id="btn-role-child" class="role-btn active" onclick="setRole('Descendant')">🌱 Child / Descendant</button>
          <button type="button" id="btn-role-spouse" class="role-btn" onclick="setRole('Spouse')">💍 Spouse / Partner</button>
        </div>

        <div class="form-group" id="relation-group">
          <label id="relation-label" for="RelatedToID">Who is your Parent in this family? *</label>
          <input
            type="text"
            placeholder="Type name to filter..."
            oninput="filterRelativeDropdown(this.value, document.getElementById('EditMemberID').value)"
          />
          <select id="RelatedToID" required></select>
        </div>

        <div class="form-group">
          <label for="FullName">Full Name *</label>
          <input type="text" id="FullName" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="Nickname">Nickname (shown under name)</label>
            <input type="text" id="Nickname" />
          </div>
          <div class="form-group">
            <label for="Gender">Gender</label>
            <select id="Gender">
              <option value="Female">Female</option>
              <option value="Male">Male</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="BirthDate">Birthdate</label>
            <input type="date" id="BirthDate" />
          </div>
          <div class="form-group">
            <label id="photo-label" for="PhotoFile">Profile Photo</label>
            <input type="file" id="PhotoFile" accept="image/*" />
          </div>
        </div>

        <div class="form-group">
          <label for="Occupation">Occupation / Role</label>
          <input type="text" id="Occupation" />
        </div>

        <div class="form-group">
          <label for="Hobbies">Hobbies (comma-separated)</label>
          <input type="text" id="Hobbies" placeholder="e.g., Gardening, Coffee brewing" />
          <div id="hobby-chips" class="chip-row"></div>
        </div>

        <div class="form-group">
          <label for="Sports">Sports (comma-separated)</label>
          <input type="text" id="Sports" placeholder="e.g., Golf, Tennis, Basketball" />
          <div id="sport-chips" class="chip-row"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="Phone">Mobile Number</label>
            <input type="tel" id="Phone" placeholder="+63 917..." />
          </div>
          <div class="form-group">
            <label for="City">City / Location</label>
            <input type="text" id="City" placeholder="e.g., Bato, Camarines Sur" />
          </div>
        </div>

        <div class="form-group">
          <label for="Email">Email Address</label>
          <input type="email" id="Email" placeholder="name@email.com" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="SocialFB">Facebook Username/Link</label>
            <input type="text" id="SocialFB" placeholder="username" />
          </div>
          <div class="form-group">
            <label for="SocialIG">Instagram Handle</label>
            <input type="text" id="SocialIG" placeholder="@handle" />
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary full-width">✓ Save to Family Tree</button>
      </form>
    </div>
  </div>

  <!-- QR MODAL -->
  <div id="qr-overlay" class="overlay" style="display: none;" onclick="closeOverlay(event, 'qr-overlay')">
    <div class="modal-card qr-card" onclick="event.stopPropagation()">
      <button type="button" class="close-drawer" onclick="document.getElementById('qr-overlay').style.display='none'">×</button>
      <h2>Scan to Join Family Tree</h2>
      <p class="modal-sub">Share this QR code so relatives can select their line and join.</p>
      <div id="qrcode-box" class="qrcode-box"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
